name: Build Native Qt App - Windows

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - feature/native-qt-app
    paths:
      - 'native/**'
      - '.github/workflows/native-build-windows.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      Qt6_DIR: ${{ github.workspace }}/Qt/Qt/6.8.1/msvc2022_64
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh
      
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            native/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      
      - name: Install vcpkg
        run: |
          $vcpkgPath = "${{ github.workspace }}/vcpkg"
          if (!(Test-Path $vcpkgPath)) {
            git clone https://github.com/Microsoft/vcpkg.git $vcpkgPath
            cd $vcpkgPath
            .\bootstrap-vcpkg.bat
          } else {
            cd $vcpkgPath
            git fetch origin
            git reset --hard origin/master
            .\bootstrap-vcpkg.bat
          }
        shell: pwsh
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          cache: true
          dir: ${{ github.workspace }}/Qt
      
      - name: Configure CMake
        working-directory: native
        run: |
          $vcpkgPath = "${{ github.workspace }}/vcpkg"
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake" `
            -DQt6_DIR="${{ env.Qt6_DIR }}/lib/cmake/Qt6"
        shell: pwsh
      
      - name: Build
        working-directory: native
        run: |
          cmake --build build --parallel
        shell: pwsh
      
      - name: Run Tests
        working-directory: native/build
        run: |
          ctest --output-on-failure --verbose
        shell: pwsh
        continue-on-error: true
      
      - name: Create installer directory structure
        working-directory: native/build
        run: |
          New-Item -ItemType Directory -Force -Path installer
          Copy-Item FrontDeskApp.exe installer/
          
          # Copy Qt dependencies  
          $qtPath = "${{ github.workspace }}\Qt\Qt\6.8.1\msvc2022_64\bin\windeployqt.exe"
          & $qtPath --release --qmldir ../src/ui installer/FrontDeskApp.exe
          
          # Copy config template
          Copy-Item ../config/config.template.json installer/config.json
          
          # Create README
          @"
          # Front Desk App - Native Qt Version
          
          ## Installation
          1. Extract all files to a folder
          2. Edit config.json with your settings
          3. Run FrontDeskApp.exe
          
          ## Configuration
          Edit config.json to set:
          - Square API credentials
          - Membership segments and groups
          - Google Sheets settings (optional)
          
          See config.template.json for all available options.
          "@ | Out-File -FilePath installer/README.txt -Encoding utf8
        shell: pwsh
      
      - name: Create ZIP archive
        working-directory: native/build/installer
        run: |
          Compress-Archive -Path * -DestinationPath "../FrontDeskApp-Windows.zip"
        shell: pwsh

      - name: Upload Windows snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-windows
          path: native/build/FrontDeskApp-Windows.zip
          retention-days: 1
          overwrite: true

      - name: Publish Windows snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/publish-native-snapshot.sh \
            snapshot-windows \
            native/build/FrontDeskApp-Windows.zip
